name: C11 foundation
on:
  push:
    branches: [origin, 'feature/**']
  pull_request:
    branches: [origin]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, 'address,undefined']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config libssl-dev \
            libarchive-dev libncurses-dev libglib2.0-dev libudev-dev libblkid-dev libmount-dev \
            libpolkit-gobject-1-dev libgtk-4-dev libadwaita-1-dev libpango1.0-dev \
            libfontconfig1-dev xvfb valgrind
      - name: Configure strict C11 targets
        run: meson setup build -Dgui=enabled -Db_sanitize='${{ matrix.sanitizer }}' -Db_lundef=false
      - name: Build
        run: meson compile -C build
      - name: Run sparse-file and native GTK tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: meson test -C build --print-errorlogs
      - name: Check core and CLI ownership with Valgrind
        if: matrix.sanitizer == 'none'
        run: |
          meson test -C build core partition checksum device cli-args format flasher ipc image cli-batch \
            --wrapper 'valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes --errors-for-leak-kinds=all --error-exitcode=99' \
            --num-processes 2 --timeout-multiplier 4 --print-errorlogs
      - name: Verify install staging
        if: matrix.sanitizer == 'none'
        run: DESTDIR="$RUNNER_TEMP/flashux-stage" meson install -C build --no-rebuild
